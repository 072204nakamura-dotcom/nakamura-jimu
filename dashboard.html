<script>
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const readList = k => { try{ return JSON.parse(store.get(k) || "[]"); }catch(e){ return []; } };

const pad = n => String(n).padStart(2,"0");
const WD = ["日","月","火","水","木","金","土"];
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthKey = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };

document.getElementById("motto").textContent = CONFIG.motto || "";

function renderHeader(){
  const d = new Date();
  document.getElementById("dateNum").textContent = `${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  document.getElementById("dateText").textContent = `${d.getFullYear()}年 ${WD[d.getDay()]}曜日`;
  document.getElementById("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const badge = document.getElementById("openBadge");
  const rest = CONFIG.closedDays.includes(d.getDay());
  badge.textContent = rest ? "定休日" : "営業日";
  badge.classList.toggle("rest", rest);
}

function renderBand(){
  const band = document.getElementById("band"), ticks = document.getElementById("ticks");
  band.innerHTML = ""; ticks.innerHTML = "";
  CONFIG.timeline.forEach(seg => {
    const s = toMin(seg.start), e = toMin(seg.end);
    const el = document.createElement("div");
    el.className = "seg " + seg.kind;
    el.style.left = (s/1440*100) + "%";
    el.style.width = ((e-s)/1440*100) + "%";
    el.textContent = seg.label;
    el.title = `${seg.label}　${seg.start}–${seg.end}`;
    band.appendChild(el);
  });
  [0,6,12,18,24].forEach(h => {
    const t = document.createElement("div");
    t.className = "tick";
    t.style.left = (h/24*100) + "%";
    t.textContent = pad(h) + ":00";
    ticks.appendChild(t);
  });
  const d = new Date(), nowMin = d.getHours()*60 + d.getMinutes();
  const line = document.createElement("div");
  line.className = "now-line";
  line.style.left = (nowMin/1440*100) + "%";
  band.appendChild(line);
  document.getElementById("bandNow").textContent = `現在 ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  const cur  = CONFIG.timeline.find(s => nowMin >= toMin(s.start) && nowMin < toMin(s.end));
  const next = CONFIG.timeline.find(s => toMin(s.start) > nowMin);
  const box  = document.getElementById("nextUp");
  if (CONFIG.closedDays.includes(d.getDay())){
    box.innerHTML = `今日は <b>定休日</b> です。`;
  } else if (cur){
    const left = toMin(cur.end) - nowMin;
    box.innerHTML = `いまは <b>${cur.label}</b>。あと ${Math.floor(left/60)}時間${left%60}分 で終わり。`;
  } else if (next){
    const until = toMin(next.start) - nowMin;
    box.innerHTML = `次は <b>${next.label}</b>（${next.start}）。あと ${Math.floor(until/60)}時間${until%60}分。`;
  } else {
    box.innerHTML = `今日の営業は終わりました。お疲れさまでした。`;
  }
}

/* ===== 今日やること（毎日／曜日／月次／追加） ===== */
function todaysTasks(){
  const d = new Date(), day = d.getDay(), date = d.getDate();
  const list = [];

  (CONFIG.routines.everyday || []).forEach(t => list.push({text:t, tag:"毎日", kind:"day"}));
  ((CONFIG.routines.byDay || {})[day] || []).forEach(t => list.push({text:t, tag:WD[day]+"曜", kind:"day"}));

  /* 月次：指定日を過ぎていて、今月まだ済んでいないものを出し続ける */
  const monthDone = readList("dash.month." + monthKey());
  (CONFIG.routines.monthly || []).forEach(m => {
    if (date >= m.day && !monthDone.includes(m.text)){
      const late = date > m.day;
      list.push({
        text: m.text,
        tag: late ? `${m.day}日 ・${date - m.day}日超過` : `毎月${m.day}日`,
        kind: "month"
      });
    }
  });

  readList("dash.extra." + todayKey()).forEach(t => list.push({text:t, tag:"追加", kind:"day"}));
  return list;
}

function renderTasks(){
  const wrap = document.getElementById("taskList");
  wrap.innerHTML = "";
  const dayKey = "dash.check." + todayKey();
  const monKey = "dash.month." + monthKey();
  const dayDone = readList(dayKey);
  const tasks = todaysTasks();

  tasks.forEach(t => {
    const key = (t.kind === "month") ? monKey : dayKey;
    const isDone = (t.kind === "month") ? false : dayDone.includes(t.text);
    wrap.appendChild(taskRow(t.text, t.tag, isDone, t.kind, on => {
      const now = readList(key), i = now.indexOf(t.text);
      if (on && i === -1) now.push(t.text);
      if (!on && i > -1) now.splice(i,1);
      store.set(key, JSON.stringify(now));
      renderTasks();
    }));
  });

  const doneCount = tasks.filter(t => t.kind !== "month" && dayDone.includes(t.text)).length;
  document.getElementById("taskCount").textContent = tasks.length ? `${doneCount} / ${tasks.length}` : "全部おわり";
}

function taskRow(text, tag, isDone, kind, onToggle){
  const row = document.createElement("label");
  row.className = "task" + (isDone ? " done" : "");
  const box = document.createElement("input");
  box.type = "checkbox"; box.checked = isDone;
  box.addEventListener("change", () => onToggle(box.checked));
  const label = document.createElement("span");
  label.textContent = text;
  row.append(box, label);
  if (tag){
    const em = document.createElement("em");
    em.className = "task-tag" + (kind === "month" ? " month" : "");
    em.textContent = tag;
    row.appendChild(em);
  }
  return row;
}

document.getElementById("taskAdd").addEventListener("click", addTask);
document.getElementById("taskInput").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
function addTask(){
  const input = document.getElementById("taskInput");
  const val = input.value.trim();
  if (!val) return;
  const key = "dash.extra." + todayKey();
  const extra = readList(key);
  extra.push(val);
  store.set(key, JSON.stringify(extra));
  input.value = "";
  renderTasks();
}

/* ===== 期限 ===== */
function renderDeadlines(){
  const wrap = document.getElementById("deadlineList");
  wrap.innerHTML = "";
  const today = new Date(); today.setHours(0,0,0,0);
  const rows = (CONFIG.deadlines || []).map(dl => ({
    ...dl, days: Math.round((new Date(dl.date + "T00:00:00") - today) / 86400000)
  })).sort((a,b) => a.days - b.days);
  if (!rows.length){ wrap.innerHTML = '<div class="dl-date">まだ登録がありません</div>'; return; }
  rows.forEach(r => {
    const row = document.createElement("div"); row.className = "dl";
    const days = document.createElement("div");
    days.className = "dl-days" + (r.days <= 14 ? " warn" : "");
    days.textContent = r.days < 0 ? "済" : r.days;
    const unit = document.createElement("div");
    unit.className = "dl-unit"; unit.textContent = r.days < 0 ? "" : "日";
    const body = document.createElement("div"); body.className = "dl-body";
    const nm = document.createElement("div"); nm.className = "dl-name"; nm.textContent = r.name;
    const dt = document.createElement("div"); dt.className = "dl-date"; dt.textContent = r.date;
    body.append(nm, dt);
    row.append(days, unit, body);
    wrap.appendChild(row);
  });
}

/* ===== プロジェクト ===== */
function renderProjects(){
  const grid = document.getElementById("projGrid");
  grid.innerHTML = "";
  (CONFIG.projects || []).forEach((p, pi) => {
    const key = "dash.proj." + pi;
    const done = readList(key);
    const card = document.createElement("div");
    card.className = "proj " + (p.accent || "ash");
    const nm = document.createElement("div"); nm.className = "proj-name"; nm.textContent = p.name;
    const wt = document.createElement("div"); wt.className = "proj-what"; wt.textContent = p.what || "";
    card.append(nm, wt);
    if (p.status){
      const st = document.createElement("div"); st.className = "proj-status"; st.textContent = p.status;
      card.appendChild(st);
    }
    const tasks = p.tasks || [];
    tasks.forEach(t => {
      card.appendChild(taskRow(t, "", done.includes(t), "proj", on => {
        const now = readList(key), i = now.indexOf(t);
        if (on && i === -1) now.push(t);
        if (!on && i > -1) now.splice(i,1);
        store.set(key, JSON.stringify(now));
        renderProjects();
      }));
    });
    if (tasks.length){
      const bar = document.createElement("div"); bar.className = "proj-bar";
      const fill = document.createElement("i");
      fill.style.width = Math.round(tasks.filter(t => done.includes(t)).length / tasks.length * 100) + "%";
      bar.appendChild(fill);
      card.appendChild(bar);
    }
    if (p.url){
      const a = document.createElement("a");
      a.className = "proj-link"; a.href = p.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "ひらく →";
      card.appendChild(a);
    }
    grid.appendChild(card);
  });
}

/* ===== リンク ===== */
function renderLinks(){
  const grid = document.getElementById("linkGrid");
  grid.innerHTML = "";
  (CONFIG.links || []).forEach(g => {
    const col = document.createElement("div");
    const title = document.createElement("div");
    title.className = "lgroup-title " + (g.accent || "ash");
    title.textContent = g.group;
    col.appendChild(title);
    g.items.forEach(it => {
      const a = document.createElement("a");
      a.className = "link"; a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = it.name;
      col.appendChild(a);
    });
    grid.appendChild(col);
  });
}

/* ===== メモ ===== */
const memo = document.getElementById("memo");
memo.value = store.get("dash.memo") || "";
let memoTimer = null;
memo.addEventListener("input", () => {
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {
    store.set("dash.memo", memo.value);
    const d = new Date();
    document.getElementById("memoSaved").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())} に保存しました`;
  }, 500);
});

renderHeader(); renderBand(); renderTasks(); renderDeadlines(); renderProjects(); renderLinks();
setInterval(() => { renderHeader(); renderBand(); }, 30000);
</script>
