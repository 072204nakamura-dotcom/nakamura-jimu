<style>
:root{
  --paper:#F2F3EE; --paper-2:#FAFAF7;

.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}

textarea{width:100%;min-height:130px;resize:vertical;font-family:inherit;font-size:14.5px;line-height:1.8;padding:12px 14px;border:1px solid var(--line);background:#fff;color:var(--ink)}

<script>
/* ============================================================
   下ごしらえ
   ============================================================ */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const pad = n => String(n).padStart(2,"0");
const WD  = ["日","月","火","水","木","金","土"];
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthKey = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const toMin = s => { const [h,m]=String(s).split(":").map(Number); return (h||0)*60+(m||0); };
const NEXT = { none:"doing", doing:"done", done:"none" };
const STATE_LABEL = { none:"未着手", doing:"作業中", done:"済" };

let CONFIG = FALLBACK_CONFIG;
let STATE  = { day:{}, month:{}, proj:{}, notes:{}, memo:"", extra:{} };
let YOYAKU = null;

/* 状態の入れ物を必ず用意する */
function normalizeState(s){
  s = (s && typeof s === "object") ? s : {};
  ["day","month","proj","notes","extra"].forEach(k => {
    if (!s[k] || typeof s[k] !== "object") s[k] = {};
  });
  if (typeof s.memo !== "string") s.memo = "";
  return s;
}

/* 状態の読み書きの入口 */
const dayState   = () => STATE.day[todayKey()]   || (STATE.day[todayKey()]   = {});
const monthState = () => STATE.month[monthKey()] || (STATE.month[monthKey()] = {});
const projState  = i  => STATE.proj[i]           || (STATE.proj[i]           = {});
const extraList  = () => STATE.extra[todayKey()] || (STATE.extra[todayKey()] = []);

/* 古い日次データを掃除（14日より前は捨てる） */
function pruneState(){
  const limit = new Date(); limit.setDate(limit.getDate() - 14);
  const lim = `${limit.getFullYear()}-${pad(limit.getMonth()+1)}-${pad(limit.getDate())}`;
  ["day","extra"].forEach(k => {
    Object.keys(STATE[k]).forEach(d => { if (d < lim) delete STATE[k][d]; });
  });
}


/* ============================================================
   同期の表示
   ============================================================ */
function setSync(kind, msg){
  const el = document.getElementById("sync");
  el.className = "sync " + kind;
  document.getElementById("syncMsg").textContent = msg;
}


/* ============================================================
   読み込み
   ============================================================ */
async function loadAll(){
  /* まず手元の控えを表示（クラウドが遅くても待たされない） */
  const localState = store.get("dash.state.v5");
  if (localState){ try{ STATE = normalizeState(JSON.parse(localState)); }catch(e){} }
  const localConfig = store.get("dash.config.v5");
  if (localConfig){ try{ CONFIG = JSON.parse(localConfig); }catch(e){} }
  renderAll();

  if (!GAS_URL){
    setSync("err", "クラウド未設定（ファイル内の GAS_URL が空です）");
    document.getElementById("footNote").textContent = "この端末のブラウザにだけ保存されています";
    loadYoyaku();
    return;
  }

  setSync("busy", "クラウドから読み込み中…");
  try{
    const res  = await fetch(GAS_URL + "?t=" + Date.now());
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "GASがエラーを返しました");

    if (data.config && data.config.links) {
      CONFIG = data.config;
      store.set("dash.config.v5", JSON.stringify(CONFIG));
    }
    STATE = normalizeState(data.state);
    store.set("dash.state.v5", JSON.stringify(STATE));

    const d = new Date();
    setSync("ok", `クラウドと同期しました（${pad(d.getHours())}:${pad(d.getMinutes())}）`);
    document.getElementById("footNote").textContent = "スプレッドシートと同期しています";
    renderAll();
  }catch(err){
    setSync("err", "クラウドに繋がりませんでした。この端末の控えで表示しています");
    document.getElementById("footNote").textContent = "オフライン表示中";
  }
  loadYoyaku();
}

/* 保存（少し待ってからまとめて送る） */
let saveTimer = null;
function saveState(){
  pruneState();
  store.set("dash.state.v5", JSON.stringify(STATE));
  if (!GAS_URL) return;
  clearTimeout(saveTimer);
  setSync("busy", "保存待ち…");
  saveTimer = setTimeout(async () => {
    try{
      await fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ type: "state", data: STATE })
      });
      const d = new Date();
      setSync("ok", `保存しました（${pad(d.getHours())}:${pad(d.getMinutes())}）`);
    }catch(err){
      setSync("err", "保存できませんでした（この端末には残っています）");
    }
  }, 1200);
}

document.getElementById("reload").addEventListener("click", loadAll);


/* ============================================================
   今日の予約（空き状況カレンダーのGASから読む）
   ============================================================ */
/* 空き状況カレンダーのGASが返す形：
   { start, numDays, reserveUrl, updatedAt,
     dayData: { "2026-08-03": { lunch:"○", dinner:"△" }, ... } }
   lunch / dinner に入るのは ○（空きあり）／△（残りわずか）／✕（満席）／休 の4種類。
   人数ではなく「8卓のうち何卓使ったか」で判定された記号です。       */
async function loadYoyaku(){
  if (!YOYAKU_URL) return;
  try{
    const res = await fetch(YOYAKU_URL + "?t=" + Date.now());
    const raw = await res.json();
    YOYAKU = (raw && raw.dayData) ? raw : null;
    renderYoyaku();
  }catch(err){
    /* 取れなくても画面は止めない */
  }
}

/* 記号 → 表示の見た目と言い換え */
const MARK_INFO = {
  "○": { cls:"ok",     word:"空きあり" },
  "△": { cls:"few",    word:"残りわずか" },
  "✕": { cls:"full",   word:"満席" },
  "×": { cls:"full",   word:"満席" },
  "休": { cls:"closed", word:"営業なし" }
};

function renderYoyaku(){
  const sec = document.getElementById("resSec");
  if (!YOYAKU || !YOYAKU.dayData){ sec.hidden = true; return; }
  const today = YOYAKU.dayData[todayKey()];
  if (!today){ sec.hidden = true; return; }

  const grid = document.getElementById("resGrid");
  grid.innerHTML = "";

  const lunch  = String(today.lunch  || "").trim();
  const dinner = String(today.dinner || "").trim();

  if (lunch === "休" && dinner === "休"){
    grid.appendChild(resCard("本日", "休", "お休み"));
  } else {
    if (lunch)  grid.appendChild(resCard("ランチ",  lunch,  null));
    if (dinner) grid.appendChild(resCard("ディナー", dinner, null));
  }

  const stamp = YOYAKU.updatedAt
    ? String(YOYAKU.updatedAt).replace("T", " ").slice(0, 16)
    : "";
  document.getElementById("resNote").textContent =
    stamp ? "空き状況カレンダーの最終更新：" + stamp + "（8卓基準の判定）" : "";
  sec.hidden = false;
}

function resCard(when, mark, overrideWord){
  const info = MARK_INFO[mark] || { cls:"", word:"" };
  const el = document.createElement("div");
  el.className = "res";
  const w = document.createElement("div"); w.className = "res-when"; w.textContent = when;
  const m = document.createElement("div"); m.className = "res-mark " + info.cls; m.textContent = mark;
  const u = document.createElement("div"); u.className = "res-unit"; u.textContent = overrideWord || info.word;
  el.append(w, m, u);
  return el;
}


/* ============================================================
   描画
   ============================================================ */
function renderAll(){
  renderHeader(); renderBand(); renderTasks();
  renderDeadlines(); renderProjects(); renderLinks();
  renderDoingStrip(); renderMemo(); renderYoyaku();
}

function renderHeader(){
  const d = new Date();
  document.getElementById("motto").textContent = CONFIG.motto || "";
  document.getElementById("dateNum").textContent = `${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  document.getElementById("dateText").textContent = `${d.getFullYear()}年 ${WD[d.getDay()]}曜日`;
  document.getElementById("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const badge = document.getElementById("openBadge");
  const rest = (CONFIG.closedDays || []).includes(d.getDay());
  badge.textContent = rest ? "定休日" : "営業日";
  badge.classList.toggle("rest", rest);
}

function renderBand(){
  const band = document.getElementById("band"), ticks = document.getElementById("ticks");
  band.innerHTML = ""; ticks.innerHTML = "";
  (CONFIG.timeline || []).forEach(seg => {
    const s = toMin(seg.start), e = toMin(seg.end);
    const el = document.createElement("div");
    el.className = "seg " + (seg.kind || "prep");
    el.style.left = (s/1440*100) + "%";
    el.style.width = ((e-s)/1440*100) + "%";
    el.textContent = seg.label;
    el.title = `${seg.label}　${seg.start}–${seg.end}`;
    band.appendChild(el);
  });
  [0,6,12,18,24].forEach(h => {
    const t = document.createElement("div");
    t.className = "tick";
    t.style.left = (h/24*100) + "%";
    t.textContent = pad(h) + ":00";
    ticks.appendChild(t);
  });
  const d = new Date(), nowMin = d.getHours()*60 + d.getMinutes();
  const line = document.createElement("div");
  line.className = "now-line";
  line.style.left = (nowMin/1440*100) + "%";
  band.appendChild(line);
  document.getElementById("bandNow").textContent = `現在 ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  const tl = CONFIG.timeline || [];
  const cur  = tl.find(s => nowMin >= toMin(s.start) && nowMin < toMin(s.end));
  const next = tl.find(s => toMin(s.start) > nowMin);
  const box  = document.getElementById("nextUp");
  if ((CONFIG.closedDays || []).includes(d.getDay())){
    box.innerHTML = `今日は <b>定休日</b> です。`;
  } else if (cur){
    const left = toMin(cur.end) - nowMin;
    box.innerHTML = `いまは <b>${cur.label}</b>。あと ${Math.floor(left/60)}時間${left%60}分 で終わり。`;
  } else if (next){
    const until = toMin(next.start) - nowMin;
    box.innerHTML = `次は <b>${next.label}</b>（${next.start}）。あと ${Math.floor(until/60)}時間${until%60}分。`;
  } else {
    box.innerHTML = `今日の営業は終わりました。お疲れさまでした。`;
  }
}

/* --- タスク行（3状態） --- */
function taskRow(text, tag, state, tagKind, onSet){
  const row = document.createElement("div");
  row.className = "task st-" + state;
  row.tabIndex = 0;
  row.setAttribute("role", "button");
  row.setAttribute("aria-label", `${text}（${STATE_LABEL[state]}）`);

  const box = document.createElement("span"); box.className = "cbox";
  const tx  = document.createElement("span"); tx.className = "tx"; tx.textContent = text;
  row.append(box, tx);

  if (tag){
    const em = document.createElement("em");
    em.className = "task-tag" + (tagKind === "month" ? " month" : "");
    em.textContent = tag;
    row.appendChild(em);
  }

  if (state === "doing"){
    const note = document.createElement("input");
    note.className = "doing-note";
    note.placeholder = "どこまでやった？（メモ・自動保存）";
    note.value = STATE.notes[text] || "";
    note.addEventListener("click",  e => e.stopPropagation());
    note.addEventListener("keydown", e => e.stopPropagation());
    let t = null;
    note.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        STATE.notes[text] = note.value;
        saveState();
        renderDoingStrip();
      }, 500);
    });
    row.appendChild(note);
  }

  const cycle = () => onSet(NEXT[state]);
  row.addEventListener("click", cycle);
  row.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); cycle(); }
  });
  return row;
}

/* --- 今日やること --- */
function todaysTasks(){
  const d = new Date(), day = d.getDay(), date = d.getDate();
  const r = CONFIG.routines || {};
  const list = [];
  (r.everyday || []).forEach(t => list.push({text:t, tag:"毎日", kind:"day"}));
  ((r.byDay || {})[day] || []).forEach(t => list.push({text:t, tag:WD[day]+"曜", kind:"day"}));

  const mSt = monthState();
  (r.monthly || []).forEach(m => {
    if (date >= m.day && mSt[m.text] !== "done"){
      const late = date > m.day;
      list.push({
        text: m.text,
        tag: late ? `${m.day}日 ・${date - m.day}日超過` : `毎月${m.day}日`,
        kind: "month"
      });
    }
  });

  extraList().forEach(t => list.push({text:t, tag:"追加", kind:"day"}));
  return list;
}

function renderTasks(){
  const wrap = document.getElementById("taskList");
  wrap.innerHTML = "";
  const dSt = dayState(), mSt = monthState();
  const tasks = todaysTasks();

  tasks.forEach(t => {
    const isMonth = t.kind === "month";
    const stObj = isMonth ? mSt : dSt;
    const state = stObj[t.text] || "none";
    wrap.appendChild(taskRow(t.text, t.tag, state, t.kind, next => {
      if (next === "none") delete stObj[t.text]; else stObj[t.text] = next;
      saveState();
      renderTasks(); renderDoingStrip();
    }));
  });

  const done  = tasks.filter(t => (t.kind==="month" ? mSt : dSt)[t.text] === "done").length;
  const doing = tasks.filter(t => (t.kind==="month" ? mSt : dSt)[t.text] === "doing").length;
  document.getElementById("taskCount").textContent =
    tasks.length ? `済${done} ・作業中${doing} ／ ${tasks.length}` : "全部おわり";
}

document.getElementById("taskAdd").addEventListener("click", addTask);
document.getElementById("taskInput").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });
function addTask(){
  const input = document.getElementById("taskInput");
  const val = input.value.trim();
  if (!val) return;
  extraList().push(val);
  saveState();
  input.value = "";
  renderTasks(); renderDoingStrip();
}

/* --- やりかけストリップ --- */
function collectDoing(){
  const out = [];
  const dSt = dayState(), mSt = monthState();
  todaysTasks().forEach(t => {
    const st = (t.kind==="month" ? mSt : dSt)[t.text];
    if (st === "doing") out.push({ text:t.text, src: t.kind==="month" ? "今日やること（月次）" : "今日やること" });
  });
  (CONFIG.projects || []).forEach((p, pi) => {
    const st = projState(pi);
    (p.tasks || []).forEach(t => { if (st[t] === "doing") out.push({ text:t, src:p.name }); });
  });
  out.forEach(o => o.note = STATE.notes[o.text] || "");
  return out;
}

function renderDoingStrip(){
  const sec  = document.getElementById("doingSec");
  const list = document.getElementById("doingList");
  const items = collectDoing();
  if (!items.length){ sec.hidden = true; return; }
  sec.hidden = false;
  document.getElementById("doingCount").textContent = items.length + "件";
  list.innerHTML = "";
  items.forEach(it => {
    const row  = document.createElement("div"); row.className = "doing-item";
    const mark = document.createElement("span"); mark.className = "doing-mark"; mark.textContent = "▶";
    const body = document.createElement("div");
    const tx   = document.createElement("div"); tx.className = "d-tx"; tx.textContent = it.text;
    const meta = document.createElement("div"); meta.className = "d-meta";
    const b = document.createElement("b"); b.textContent = it.src;
    meta.appendChild(b);
    if (it.note) meta.appendChild(document.createTextNode("　─ " + it.note));
    body.append(tx, meta);
    row.append(mark, body);
    list.appendChild(row);
  });
}

/* --- 期限 --- */
function renderDeadlines(){
  const wrap = document.getElementById("deadlineList");
  wrap.innerHTML = "";
  const today = new Date(); today.setHours(0,0,0,0);
  const rows = (CONFIG.deadlines || []).map(dl => ({
    ...dl, days: Math.round((new Date(dl.date + "T00:00:00") - today) / 86400000)
  })).sort((a,b) => a.days - b.days);
  if (!rows.length){ wrap.innerHTML = '<div class="dl-date">まだ登録がありません</div>'; return; }
  rows.forEach(r => {
    const row  = document.createElement("div"); row.className = "dl";
    const days = document.createElement("div");
    days.className = "dl-days" + (r.days <= 14 ? " warn" : "");
    days.textContent = r.days < 0 ? "済" : r.days;
    const unit = document.createElement("div"); unit.className = "dl-unit"; unit.textContent = r.days < 0 ? "" : "日";
    const body = document.createElement("div"); body.className = "dl-body";
    const nm = document.createElement("div"); nm.className = "dl-name"; nm.textContent = r.name;
    const dt = document.createElement("div"); dt.className = "dl-date"; dt.textContent = r.date;
    body.append(nm, dt);
    row.append(days, unit, body);
    wrap.appendChild(row);
  });
}

/* --- プロジェクト --- */
function renderProjects(){
  const grid = document.getElementById("projGrid");
  grid.innerHTML = "";
  (CONFIG.projects || []).forEach((p, pi) => {
    const stObj = projState(pi);
    const card = document.createElement("div");
    card.className = "proj " + (p.accent || "ash");
    const nm = document.createElement("div"); nm.className = "proj-name"; nm.textContent = p.name;
    const wt = document.createElement("div"); wt.className = "proj-what"; wt.textContent = p.what || "";
    card.append(nm, wt);
    if (p.status){
      const st = document.createElement("div"); st.className = "proj-status"; st.textContent = p.status;
      card.appendChild(st);
    }
    const tasks = p.tasks || [];
    tasks.forEach(t => {
      const state = stObj[t] || "none";
      card.appendChild(taskRow(t, "", state, "proj", next => {
        if (next === "none") delete stObj[t]; else stObj[t] = next;
        saveState();
        renderProjects(); renderDoingStrip();
      }));
    });
    if (tasks.length){
      const done  = tasks.filter(t => stObj[t] === "done").length;
      const doing = tasks.filter(t => stObj[t] === "doing").length;
      const bar = document.createElement("div"); bar.className = "proj-bar";
      const fd = document.createElement("i"); fd.className = "fd"; fd.style.width = Math.round(done/tasks.length*100) + "%";
      const fg = document.createElement("i"); fg.className = "fg"; fg.style.width = Math.round(doing/tasks.length*100) + "%";
      bar.append(fd, fg);
      card.appendChild(bar);
    }
    if (p.url){
      const a = document.createElement("a");
      a.className = "proj-link"; a.href = p.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "ひらく →";
      card.appendChild(a);
    }
    grid.appendChild(card);
  });
}

/* --- リンク --- */
function renderLinks(){
  const grid = document.getElementById("linkGrid");
  grid.innerHTML = "";
  (CONFIG.links || []).forEach(g => {
    const col = document.createElement("div");
    const title = document.createElement("div");
    title.className = "lgroup-title " + (g.accent || "ash");
    title.textContent = g.group;
    col.appendChild(title);
    (g.items || []).forEach(it => {
      const a = document.createElement("a");
      a.className = "link"; a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = it.name;
      col.appendChild(a);
    });
    grid.appendChild(col);
  });
}

/* --- 覚え書き --- */
const memoEl = document.getElementById("memo");
let memoTimer = null;
function renderMemo(){
  if (document.activeElement !== memoEl) memoEl.value = STATE.memo || "";
}
memoEl.addEventListener("input", () => {
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {
    STATE.memo = memoEl.value;
    saveState();
    const d = new Date();
    document.getElementById("memoSaved").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())} に保存しました`;
  }, 600);
});


/* ============================================================
   起動
   ============================================================ */
loadAll();
setInterval(() => { renderHeader(); renderBand(); }, 30000);
</script>
